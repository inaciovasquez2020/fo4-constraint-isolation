name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Verify FO4 constraint isolation
        run: python tools/verify_fo4_constraint_isolation.py
      - name: Run tests
        run: python -m pytest -q
